name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing anything.
  workflow_dispatch:

# Read the repo, write a Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If two merges land close together, let the newer one win rather than
# queueing a stale deploy behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uxpulse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uxpulse/package-lock.json

      - run: npm ci

      # The site is served from /buildwithgemini-uxpulse/, not a domain root.
      # Without --base, every asset URL 404s and you get a blank page.
      - name: Build
        run: npx vite build --base=/buildwithgemini-uxpulse/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uxpulse/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
